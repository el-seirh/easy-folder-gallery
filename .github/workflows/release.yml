name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: |
          for f in $(find . -name '*.php' -not -path './tests/*'); do
            php -l "$f"
          done

      - name: Run smoke test
        run: php tests/smoke-test.php

      - name: Build plugin ZIP
        run: |
          mkdir -p build/easy-folder-gallery
          rsync -a \
            --exclude '.git*' \
            --exclude '.github' \
            --exclude '.idea' \
            --exclude 'tests' \
            --exclude 'build' \
            --exclude 'HANDOVER.md' \
            ./ build/easy-folder-gallery/
          cd build
          zip -r "easy-folder-gallery-${GITHUB_REF_NAME#v}.zip" easy-folder-gallery

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/easy-folder-gallery-*.zip
          generate_release_notes: true
